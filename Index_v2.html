<script>

function loadExcel() {

    const file =
    document.getElementById("excelFile").files[0];

    if(!file){

        alert("Please upload Master DSR.xlsm");

        return;

    }

    const reader = new FileReader();

    reader.onload = function(e){

        alert(
            "Selected File:\n\n" +
            file.name
        );

    };

    reader.readAsArrayBuffer(file);

}

</script>
