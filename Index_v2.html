<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MTD Sales Dashboard</title>

<script src="https://cdnjsom/ajax/libs/xlsx/0.18.5/xlsx.full.min.jsscript>

<style>

body{
font-family:Segoe UI;
background:#f4f7fb;
padding:20px;
}

.header{
background:#003366;
color:white;
padding:20px;
text-align:center;
border-radius:10px;
}

.upload{
background:white;
padding:20px;
margin-top:20px;
border-radius:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-top:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.15);
}

.title{
font-size:14px;
color:gray;
}

.value{
font-size:28px;
font-weight:bold;
margin-top:10px;
}

.section{
background:white;
padding:20px;
margin-top:20px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.15);
overflow:auto;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#0070c0;
color:white;
padding:10px;
}

td{
padding:10px;
border:1px solid #ddd;
}

.green{
color:green;
}

.red{
color:red;
}

.orange{
color:orange;
}

</style>

</head>

<body>

<div class="header">
<h1>MTD SALES DASHBOARD</h1>
<p>Upload Master DSR File</p>
</div>

<div class="upload">

<input type="file"
id="excelFile"
accept=".xlsx,.xls,.xlsm">

<button onclick="loadExcel()">
Generate Dashboard
</button>

</div>

<div class="grid">

<div class="card">
<div class="title">Target NOR</div>
<div id="target" class="value">0</div>
</div>

<div class="card">
<div class="title">Actual NOR</div>
<div id="actual" class="value green">0</div>
</div>

<div class="card">
<div class="title">Achievement %</div>
<div id="achievement" class="value">0%</div>
</div>

<div class="card">
<div class="title">Status</div>
<div id="status" class="value">-</div>
</div>

</div>

<div class="section">

<h2>SM Performance</h2>

<table id="smTable">

<tr>
<th>SM</th>
<th>Target</th>
<th>Actual</th>
<th>Achievement %</th>
</tr>

</table>

</div>

<div class="section">

<h2>Lead Ranking</h2>

<table id="leadTable">

<tr>
<th>Rank</th>
<th>Lead</th>
<th>Actual NOR</th>
</tr>

</table>

</div>

<div class="section">

<h2>NSM Summary</h2>

<table id="nsmTable">

<tr>
<th>NSM</th>
<th>Actual NOR</th>
</tr>

</table>

</div>

<div class="section">

<h2>Top Clients</h2>

<table id="clientTable">

<tr>
<th>Client</th>
<th>NOR</th>
</tr>

</table>

</div>

<script>

function loadExcel(){

const file =
document.getElementById("excelFile")
.files[0];

if(!file){

alert("Upload DSR file");

return;
}

const reader =
new FileReader();

reader.onload=function(e){

const workbook =
XLSX.read(
e.target.result,
{
type:'array'
}
);

const targetSheet =
workbook.Sheets["Targets"];

const masterSheet =
workbook.Sheets["Master"];

if(!targetSheet || !masterSheet){

alert(
"Sheet names must be Targets and Master"
);

return;
}

const targets =
XLSX.utils.sheet_to_json(
targetSheet
);

const master =
XLSX.utils.sheet_to_json(
masterSheet
);

generateDashboard(
targets,
master
);

};

reader.readAsArrayBuffer(file);

}

function num(v){

return Number(
String(v || 0)
.replace(/,/g,'')
);

}

function formatCr(v){

return (
v/10000000
).toFixed(2)+" Cr";

}

function generateDashboard(
targets,
master
){

let totalTarget=0;

targets.forEach(r=>{

totalTarget += num(r.Target);

});

let totalActual=0;

master.forEach(r=>{

totalActual += num(r.NOR);

});

const ach =
(
(totalActual/totalTarget)
*100
).toFixed(1);

document.getElementById(
"target"
).innerHTML=
formatCr(totalTarget);

document.getElementById(
"actual"
).innerHTML=
formatCr(totalActual);

document.getElementById(
"achievement"
).innerHTML=
ach+"%";

document.getElementById(
"status"
).innerHTML=
ach>=100
?
"✅ Achieved"
:
"❌ Shortfall";

buildSMTable(
targets,
master
);

buildLeadTable(
master
);

buildNSMTable(
master
);

buildClientTable(
master
);

}

function buildSMTable(
targets,
master
){

const actualMap={};

master.forEach(r=>{

const sm=r.SM;

if(!actualMap[sm])
actualMap[sm]=0;

actualMap[sm]+=num(r.NOR);

});

let html=`
<tr>
<th>SM</th>
<th>Target</th>
<th>Actual</th>
<th>Achievement %</th>
</tr>
`;

targets.forEach(r=>{

const sm=r.SM;

const target=
num(r.Target);

const actual=
actualMap[sm]||0;

const ach=
target
?
((actual/target)*100)
.toFixed(1)
:0;

html+=`
<tr>
<td>${sm}</td>
<td>${formatCr(target)}</td>
<td>${formatCr(actual)}</td>
<td>${ach}%</td>
</tr>
`;

});

document.getElementById(
"smTable"
).innerHTML=
html;

}

function buildLeadTable(
master
){

const leadMap={};

master.forEach(r=>{

const lead=r.Lead;

if(!leadMap[lead])
leadMap[lead]=0;

leadMap[lead]+=num(r.NOR);

});

const sorted=
Object.entries(leadMap)
.sort((a,b)=>b[1]-a[1]);

let html=`
<tr>
<th>Rank</th>
<th>Lead</th>
<th>Actual NOR</th>
</tr>
`;

sorted.forEach(
(item,index)=>{

html+=`
<tr>
<td>${index+1}</td>
<td>${item[0]}</td>
<td>${formatCr(item[1])}</td>
</tr>
`;

});

document.getElementById(
"leadTable"
).innerHTML=
html;

}

function buildNSMTable(
master
){

const map={};

master.forEach(r=>{

const nsm=r.NSM;

if(!map[nsm])
map[nsm]=0;

map[nsm]+=num(r.NOR);

});

let html=`
<tr>
<th>NSM</th>
<th>Actual NOR</th>
</tr>
`;

Object.entries(map)
.sort((a,b)=>b[1]-a[1])
.forEach(item=>{

html+=`
<tr>
<td>${item[0]}</td>
<td>${formatCr(item[1])}</td>
</tr>
`;

});

document.getElementById(
"nsmTable"
).innerHTML=
html;

}

function buildClientTable(
master
){

const sorted=
master.sort(
(a,b)=>
num(b.NOR)-num(a.NOR)
);

let html=`
<tr>
<th>Client</th>
<th>NOR</th>
</tr>
`;

sorted
.slice(0,10)
.forEach(r=>{

html+=`
<tr>
<td>${r["Client Name"]}</td>
<td>${formatCr(
num(r.NOR)
)}</td>
</tr>
`;

});

document.getElementById(
"clientTable"
).innerHTML=
html;

}

</script>

</body>
</html>
