<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pine Labs Auto Dashboard</title>

<script src="sdelivr.net/npm/xlsx/dist/xlsx.full.min.jsscript>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    padding:20px;
}

h1{
    color:#003366;
}

.upload{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

.card{
    background:white;
    width:220px;
    display:inline-block;
    margin:10px;
    padding:20px;
    text-align:center;
    border-radius:10px;
    box-shadow:0px 2px 5px gray;
}

.value{
    font-size:26px;
    color:blue;
    font-weight:bold;
}

</style>

</head>

<body>

<h1>PINE LABS MTD NOR DASHBOARD</h1>

<div class="upload">

<h3>Upload Master DSR.xlsm</h3>

<input type="file" id="excelFile">

<button onclick="processExcel()">
Generate Dashboard
</button>

</div>

<div class="card">
<h3>Total Target</h3>
<div id="target" class="value">0</div>
</div>

<div class="card">
<h3>Total NOR</h3>
<div id="nor" class="value">0</div>
</div>

<div class="card">
<h3>Achievement %</h3>
<div id="ach" class="value">0%</div>
</div>

<div class="card">
<h3>RTG</h3>
<div id="rtg" class="value">0</div>
</div>

<script>

function processExcel(){

const file =
document.getElementById("excelFile")
.files[0];

if(!file){

alert("Please upload Master DSR.xlsm");

return;
}

const reader = new FileReader();

reader.onload = function(e){

const data =
new Uint8Array(e.target.result);

const workbook =
XLSX.read(data,{
type:'array'
});

const masterSheet =
workbook.Sheets["Master"];

const targetSheet =
workbook.Sheets["Targets"];

if(!masterSheet){

alert("Master sheet not found");

return;
}

if(!targetSheet){

alert("Targets sheet not found");

return;
}

const master =
XLSX.utils
.sheet_to_json(masterSheet);

const targets =
XLSX.utils
.sheet_to_json(targetSheet);

let totalNOR = 0;

master.forEach(r=>{

totalNOR +=
Number(r.NOR||0);

});

let totalTarget = 0;

targets.forEach(r=>{

totalTarget +=
Number(r.Target||0);

});

let ach = 0;

if(totalTarget>0){

ach =
(totalNOR/totalTarget)
*100;

}

let rtg =
totalTarget-totalNOR;

document
.getElementById("target")
.innerHTML =
totalTarget.toFixed(2);

document
.getElementById("nor")
.innerHTML =
totalNOR.toFixed(2);

document
.getElementById("ach")
.innerHTML =
ach.toFixed(1)+"%";

document
.getElementById("rtg")
.innerHTML =
rtg.toFixed(2);

};

reader.readAsArrayBuffer(file);

}

</script>

</body>
</html>
