<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pine Labs MTD Sales Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Segoe UI,Arial;
background:#f4f7fb;
padding:20px;
}

.header{
background:#003366;
color:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
text-align:center;
}

.upload-box{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0px 2px 6px rgba(0,0,0,0.15);
}

.kpi-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0px 2px 5px rgba(0,0,0,0.15);
}

.kpi-title{
font-size:14px;
color:gray;
}

.kpi-value{
font-size:30px;
font-weight:bold;
margin-top:10px;
}

.section{
background:white;
padding:20px;
margin-top:20px;
border-radius:12px;
box-shadow:0px 2px 5px rgba(0,0,0,0.15);
}

.section h2{
margin-bottom:15px;
color:#003366;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#0070c0;
color:white;
padding:10px;
}

td{
padding:10px;
border:1px solid #ddd;
}

.green{
color:green;
}

.red{
color:red;
}

.orange{
color:orange;
}

.blue{
color:#003366;
}

</style>

</head>

<body>

<div class="header">

<h1>PINE LABS MTD SALES DASHBOARD</h1>

<p>Target vs NOR Performance Dashboard</p>

</div>

<div class="upload-box">

<h3>Upload Master DSR.xlsm</h3>

<input
type="file"
id="excelFile"
accept=".xls,.xlsx,.xlsm"
/>

<button onclick="loadExcel()">
Generate Dashboard
</button>

</div>

<div class="kpi-grid">

<div class="card">
<div class="kpi-title">Target NOR</div>
<div id="target" class="kpi-value blue">0</div>
</div>

<div class="card">
<div class="kpi-title">Actual NOR</div>
<div id="actual" class="kpi-value green">0</div>
</div>

<div class="card">
<div class="kpi-title">Achievement %</div>
<div id="achievement" class="kpi-value">0%</div>
</div>

<div class="card">
<div class="kpi-title">RTG / Surplus</div>
<div id="rtg" class="kpi-value">0</div>
</div>

</div>

<div class="section">

<h2>Lead Performance</h2>

<table id="leadTable">

<tr>
<th>Lead</th>
<th>Target</th>
<th>Actual NOR</th>
<th>Achievement %</th>
</tr>

</table>

</div>

<div class="section">

<h2>Top SM Ranking</h2>

<table id="smTable">

<tr>
<th>SM</th>
<th>NOR</th>
</tr>

</table>

</div>

<div class="section">

<h2>Top Clients</h2>

<table id="clientTable">

<tr>
<th>Client</th>
<th>NOR</th>
</tr>

</table>

</div>

<div class="section">

<h2>Business Mix</h2>

<table id="productTable">

<tr>
<th>Product Type</th>
<th>NOR</th>
</tr>

</table>

</div>

<script>

function loadExcel(){

alert(
"Excel processing module will be added here."
);

}

</script>

</body>

</html>
